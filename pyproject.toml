[project]
name = "autotyper"
version = "1.1.0"
description = "Types text into any text field on Windows, macOS and Linux with human-like pacing."
requires-python = ">=3.8"
license = { text = "MIT" }

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "SIM", "UP", "RUF"]
ignore = [
    "UP032",  # f-strings are fine in 3.8+, but % formatting is used in legacy paths
    "RUF001",  # ambiguous unicode chars are intentional in the test corpus
    "RUF002",
    "RUF003",
    "RUF012",  # ctypes class attributes are read-only struct descriptors
    "RUF046",  # int() on an int is intentional for readability
    "SIM105",  # contextlib.suppress is slower in the hot DPI fallback path
]

[tool.ruff.lint.per-file-ignores]
"tests/test_engine.py" = ["B023"]
"tests/test_gui.py" = ["SIM105"]
