name: Build Linux AppImage

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build AppImage (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb desktop-file-utils libtk8.6

      - name: Install build dependencies
        run: python -m pip install --upgrade pip pyinstaller python-xlib

      - name: Build the executable
        run: pyinstaller --clean --noconfirm AutoTyper.spec

      - name: Smoke-test the executable
        run: xvfb-run -a tools/smoke_check.sh dist/AutoTyper --smoke-test

      - name: Build the AppImage
        run: tools/build_appimage.sh ${{ matrix.arch }} dist

      - name: Smoke-test the AppImage
        run: >
          xvfb-run -a tools/smoke_check.sh
          dist/AutoTyper-*-linux-${{ matrix.arch }}.AppImage --appimage-extract-and-run --smoke-test

      - name: Upload the AppImage
        uses: actions/upload-artifact@v4
        with:
          name: AutoTyper-linux-${{ matrix.arch }}
          path: dist/AutoTyper-*-linux-${{ matrix.arch }}.AppImage
          if-no-files-found: error
