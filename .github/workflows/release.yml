name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish a release for"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Publish the Windows release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build the executable
        run: pyinstaller --clean --noconfirm AutoTyper.spec

      - name: Package a portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-package | Out-Null
          Copy-Item dist/AutoTyper.exe release-package/AutoTyper.exe
          Copy-Item "Start AutoTyper.bat" release-package/
          Copy-Item README.md release-package/
          Copy-Item LICENSE release-package/
          Compress-Archive -Path release-package/* -DestinationPath AutoTyper-windows-x64.zip

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: AutoTyper ${{ github.event.inputs.tag || github.ref_name }}
          draft: false
          prerelease: false
          files: |
            dist/AutoTyper.exe
            AutoTyper-windows-x64.zip
          body_path: RELEASE_NOTES.md
