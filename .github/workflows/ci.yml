name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-linux:
    name: Lint and test (Linux, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install --upgrade pip ruff pillow pyyaml python-xlib

      - name: Lint
        run: ruff check .

      - name: Run the test suite
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb openbox desktop-file-utils
          xvfb-run -a python -m unittest discover -s tests -t . -v

  test-macos:
    name: Lint and test (macOS, Python 3.12)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip ruff pillow pyyaml

      - name: Lint
        run: ruff check .

      - name: Run the test suite
        run: python -m unittest discover -s tests -t . -v

  test-windows:
    name: Test (Windows, Python 3.12)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pillow pyyaml

      - name: Run the test suite
        run: python -m unittest discover -s tests -t . -v
