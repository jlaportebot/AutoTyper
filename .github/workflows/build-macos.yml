name: Build macOS app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build DMG (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: >
          python -m pip install --upgrade pip pyinstaller
          pyobjc-framework-Quartz pyobjc-framework-Cocoa pyobjc-framework-ApplicationServices

      - name: Build, ad-hoc sign and package the DMG
        run: tools/build_dmg.sh dist

      - name: Smoke-test the app bundle
        run: tools/smoke_check.sh dist/AutoTyper.app/Contents/MacOS/AutoTyper --smoke-test

      - name: Upload the DMG
        uses: actions/upload-artifact@v4
        with:
          name: AutoTyper-macos-${{ matrix.arch }}
          path: dist/AutoTyper-*-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error
